<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Business Builder</title>
  <meta name="description" content="The Business Builder. Contact us by phone at 503-930-9141 or send a message online.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">The Business Builder</a>
    <a class="phone" href="tel:+15039309141">503-930-9141</a>
  </header>

  <main>
    <section class="hero">
      <h1>The Business Builder</h1>
      <p>Tell us about your business and what you need. We will get back to you directly.</p>
      <a class="button" href="#contact">Contact us</a>
    </section>

    <section id="contact" class="contact">
      <h2>Contact us</h2>
      <p>Call <a href="tel:+15039309141">503-930-9141</a> or send a message below.</p>

      <form id="contact-form" novalidate>
        <label>Name
          <input name="name" type="text" autocomplete="name" maxlength="100" required>
        </label>
        <label>Email
          <input name="email" type="email" autocomplete="email" maxlength="254" required>
        </label>
        <label>Phone (optional)
          <input name="phone" type="tel" autocomplete="tel" maxlength="30">
        </label>
        <label>Message
          <textarea name="message" rows="5" maxlength="5000" required></textarea>
        </label>
        <input class="hp" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="button" type="submit">Send message</button>
        <p id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> The Business Builder &middot; <a href="tel:+15039309141">503-930-9141</a></p>
  </footer>

  <script src="/contact.js"></script>
</body>
</html>
